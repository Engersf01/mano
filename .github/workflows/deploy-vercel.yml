name: Deploy to Vercel

# Deploys production on every push to main. No-ops cleanly until the three
# Vercel secrets are set, so it never shows a red X on an unconfigured repo:
#   VERCEL_TOKEN       (repo secret)  — https://vercel.com/account/tokens
#   VERCEL_ORG_ID      (repo variable or secret)
#   VERCEL_PROJECT_ID  (repo variable or secret)
# Get the two IDs by running `vercel link` locally once (writes .vercel/project.json).
#
# Prefer zero CI? Use Vercel's native Git integration instead: import the repo
# at https://vercel.com/new and it auto-deploys main + gives PR previews for
# free. In that case this workflow can be deleted.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check for Vercel token
        id: guard
        run: echo "ready=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 20

      - name: Install Vercel CLI
        if: steps.guard.outputs.ready == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        if: steps.guard.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        if: steps.guard.outputs.ready == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        if: steps.guard.outputs.ready == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Note when unconfigured
        if: steps.guard.outputs.ready != 'true'
        run: echo "Vercel secrets not set — skipping deploy. See workflow header to enable."
